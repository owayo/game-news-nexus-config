# Twinkle☆Star Knights (DMM GAMES 版。FANZA GAMES 版は twinkle_star_knights_r18)
# yaml-language-server: $schema=../../schema/source.schema.json
schema: 2
min_app_version: '26.11.6'
id: twinkle_star_knights
name: 'Twinkle☆Star Knights'
tags:
  - dmm
lists:
  - kind: html
    request:
      url: 'https://prod-dmmpcg.twinkle-star-knights.com/proxy/bottom/info/list/allInfo'
    items: '#navi_info_wrap ul.navi_info_inner_list > li'
    fields:
      url:
        selector: 'div[data-detail_url]'
        attr: data-detail_url
      published: '.list_date'
detail:
  kind: html
  fields:
    title: h2
    body:
      remove:
        - h2
        - '.infoblock_date'
# 本文の画像には取得した時刻のキャッシュ破り (t) が付く (外しても取れる)。同じ画像として扱う。
url_identity:
  images:
    - origin: 'https://dz87n5pasv7ep.cloudfront.net'
      ignore_query: ['t']
