# FANZA GAMES 新作
# yaml-language-server: $schema=../../schema/source.schema.json
schema: 2
min_app_version: '26.11.6'
id: fanza_new_games
name: FANZA GAMES 新作
channel: releases
tags:
  - dmm
  - fanza
interval_minutes: 360
lists:
  - kind: html
    request:
      url: 'https://www.dmm.co.jp/age_check/=/declared=yes/?rurl=https%3A%2F%2Fgames.dmm.co.jp%2Flist%2Fpc%3Fgame%3Dbrowser%26sort%3Dnew'
    items: section ul li a
    require: 'svg[data-testid="FiberNewIcon"]'
    fields:
      id:
        attr: data-gtm-app-id
      title: h3
      url:
        attr: href
      image:
        selector: 'img[class*="__thumbnailImage__"]'
        attr: src
      note: p
