name: ゲームの追加のお願い
description: 取得してほしいゲームのお知らせのページを教えてください
labels: [source-request]
body:
  - type: input
    id: game
    attributes:
      label: ゲームの名前
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: お知らせが載っているページの URL
      description: ログインせずに見られるページだけが対象です
      placeholder: https://example.com/news/
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 補足
      description: RSS があるか、お知らせの一覧がどこにあるかなど、分かることがあれば
